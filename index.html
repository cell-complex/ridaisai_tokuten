<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>N○M休</title>
    <style>
        html,
        body {
            height: 100vh;
            margin: 0;
            font-family: "Yu Gothic", sans-serif;
            background: #15171b;
            color: #e5e7eb;
            text-align: center;
            overflow: hidden;
        }

        /* コントロール */
        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1vw;
            padding: 0.8vw 0;
        }

        /* ボード */
        #board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0.8vw;
            justify-items: center;
            align-items: center;
            width: 95%;
            height: 75vh;
            margin: 0 auto;
        }

        /* プレイヤーカード */
        .player {
            width: 13vw;
            height: 35vh;
            background: #23262d;
            border: 1px solid #393d46;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            padding: 1vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
            font-weight: bold;
            font-size: 4vh;
            box-sizing: content-box;
        }

        /* 休み・非アクティブ */
        .inactive {
            background: #1b1d22;
            color: #656b76;
            border-color: #292c33;
        }

        /* 抜け */
        .winner {
            background: #681f29;
            color: #ffffff;
            border: 1px solid #a33b48;
            font-weight: bold;
        }

        .winner-text {
            font-size: 3vw;
            color: #ffffff;
        }

        .score {
            font-size: 4vw;
            font-weight: bold;
            color: #f0f1f3;
        }

        .status {
            font-size: 2vw;
            font-weight: bold;
            height: 2.5vw;
            color: #d0a64e;
        }

        .lock {
            font-size: 3vw;
            color: #d0a64e;
            position: relative;
            top: -2vw;
            display: inline-block;
        }

        /* ボタン共通 */
        button {
            outline: none;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }

        button:focus {
            outline: none;
        }

        button:active:not(:disabled) {
            filter: brightness(1.25);
            transform: scale(0.96);
        }

        button:disabled {
            cursor: default;
            opacity: 0.25;
        }

        /* アクションボタン */
        .btns {
            display: flex;
            gap: 0.6vw;
            justify-content: center;
            width: 90%;
            flex-wrap: wrap;
        }

        .actionBtn {
            flex: 1;
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5vw;
            font-weight: bold;
            transition: 0.15s;
            color: white;
        }

        .action-plus {
            background: #a9323c;
        }

        .action-plus:hover:not(:disabled) {
            background: #c5414b;
        }

        .action-miss {
            background: #285b91;
        }

        .action-miss:hover:not(:disabled) {
            background: #3474b3;
        }

        .action-reset {
            background: #484d56;
        }

        .action-reset:hover {
            background: #606671;
        }

        /* 抜けた枠のリセット */
        .reset {
            flex: none;
            aspect-ratio: 2;
            width: 85%;
            font-size: 1.5vw;
            background: #484d56;
            color: white;
            border-radius: 3px;
        }

        .reset:hover {
            background: #606671;
        }

        /* 上部コントロールボタン */
        .controlBtn {
            min-width: 8vw;
            height: 4vw;
            border: 1px solid #444a55;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            background: #292d35;
            color: #e5e7eb;
        }

        .GreenBtn {
            background: #285b50;
            border-color: #367365;
            color: white;
            font-size: 90%;
        }

        .GreenBtn:hover {
            background: #347363;
        }

        .PinkBtn {
            background: #63313b;
            border-color: #85414d;
            color: white;
            font-size: 70%;
        }

        .PinkBtn:hover {
            background: #82404c;
        }

        /* 数値入力 */
        #controls input[type="number"] {
            width: 3vw;
            padding: 1vw 1vw;
            border: 1px solid #454b56;
            border-radius: 2px;
            text-align: center;
            font-size: 2vw;
            font-weight: bold;
            margin: 1.5vw 0;
            background: #252932;
            color: #ffffff;
        }

        #controls label {
            font-weight: bold;
            font-size: 2vw;
            color: #c5c9d0;
        }

        #KaiYashumi {
            margin-right: 3vw;
        }

        #questionCount {
            font-weight: bold;
            font-size: 3vw;
            margin-right: 3vw;
            color: #e0b65e;
        }
    </style>
</head>

<body>

    <div id="controls">
        <input type="number" id="winCount" value="3" min="1" />
        <label>回正解で抜け！ 誤答で</label>
        <input type="number" id="lockCount" value="1" min="1" />
        <label id="KaiYashumi">回休み</label>

        <span id="questionCount"></span>

        <button id="nextBtn" class="controlBtn GreenBtn">スルー</button>
        <button id="backBtn" class="controlBtn GreenBtn">1つ戻る</button>
        <button id="AllResetBtn" class="controlBtn PinkBtn">全枠リセット</button>
        <button id="resetQuestionCount" class="controlBtn PinkBtn">問題数リセット</button>
    </div>

    <div id="board"></div>

    <script>
        const board = document.getElementById("board");
        const N = 12;
        let winNeeded = parseInt(document.getElementById("winCount").value);
        let lockTurns = parseInt(document.getElementById("lockCount").value);

        let players = Array.from({ length: N }, (_, i) => ({
            id: i + 1,
            score: 0,
            lock: 0,
            active: true,
            winner: false
        }));

        let history = [];
        let questionCount = 1;

        function saveState() {
            history.push({
                players: JSON.parse(JSON.stringify(players)),
                questionCount: questionCount
            });
            if (history.length > 50) history.shift();
            localStorage.setItem("players", JSON.stringify(players));
            localStorage.setItem("questionCount", questionCount);
        }

        function updateQuestionCount() {
            document.getElementById("questionCount").textContent = "Q" + questionCount;
        }

        function incrementQuestionCount() {
            questionCount++;
            updateQuestionCount();
        }

        function render() {
            board.innerHTML = "";
            winNeeded = parseInt(document.getElementById("winCount").value);
            lockTurns = parseInt(document.getElementById("lockCount").value);

            players.forEach(p => {
                const div = document.createElement("div");
                div.className = "player";
                if (!p.active && !p.winner) div.classList.add("inactive");
                if (p.winner) div.classList.add("winner");

                const header = document.createElement("div");
                header.textContent = `No.${p.id}`;

                const score = document.createElement("div");
                score.className = "score";
                score.textContent = p.winner ? "" : p.score;
                if (p.winner) score.innerHTML = `<span class="winner-text">抜け！</span>`;

                const status = document.createElement("div");
                status.className = "status";
                if (p.lock > 0 && !p.winner) status.innerHTML = `<span class="lock">Lock${p.lock}</span>`;
                else status.innerHTML = "";

                const btns = document.createElement("div");
                btns.className = "btns";

                if (!p.winner) {

                    /* ○ボタン */
                    const plusBtn = document.createElement("button");
                    plusBtn.textContent = "○";
                    plusBtn.className = "actionBtn action-plus";
                    plusBtn.disabled = !p.active;
                    plusBtn.onclick = () => {
                        saveState();
                        p.score++;
                        incrementQuestionCount();
                        if (p.score >= winNeeded) { p.winner = true; p.active = false; }
                        players.forEach(other => {
                            if (other.id !== p.id && other.lock > 0) {
                                other.lock--;
                                if (other.lock === 0 && !other.winner) other.active = true;
                            }
                        });
                        render();
                    };

                    /* ×ボタン */
                    const missBtn = document.createElement("button");
                    missBtn.textContent = "×";
                    missBtn.className = "actionBtn action-miss";
                    missBtn.disabled = !p.active;
                    missBtn.onclick = () => {
                        saveState();
                        p.lock = lockTurns;
                        p.active = false;
                        incrementQuestionCount();
                        players.forEach(other => {
                            if (other.id !== p.id && other.lock > 0) {
                                other.lock--;
                                if (other.lock === 0 && !other.winner) other.active = true;
                            }
                        });
                        render();
                    };

                    /* リセ（得点リセット）ボタン */
                    const scoreReset = document.createElement("button");
                    scoreReset.textContent = "0";
                    scoreReset.className = "actionBtn action-reset";
                    scoreReset.onclick = () => {
                        saveState();      // 変更前の状態を履歴に残す
                        p.score = 0;      // 得点を 0 にする

                        // ★ ロックも解除する（ここが重要）
                        p.lock = 0;       // 数値ロックを 0 に
                        p.active = true;  // アクティブに戻す

                        render();         // UI 更新
                    };


                    btns.append(plusBtn, missBtn, scoreReset);

                } else {
                    const resetBtn = document.createElement("button");
                    resetBtn.textContent = "リセット";
                    resetBtn.className = "reset";
                    resetBtn.onclick = () => {
                        saveState();
                        Object.assign(p, { score: 0, lock: 0, active: true, winner: false });
                        render();
                    };
                    btns.append(resetBtn);
                }

                div.append(header, score, status, btns);
                board.appendChild(div);
            });

            updateQuestionCount();
        }

        document.getElementById("nextBtn").onclick = () => {
            saveState();
            players.forEach(p => {
                if (p.lock > 0) {
                    p.lock--;
                    if (p.lock === 0 && !p.winner) p.active = true;
                }
            });
            incrementQuestionCount();
            render();
        };

        document.getElementById("AllResetBtn").onclick = () => {
            if (confirm("全枠をリセットしますか？")) {
                saveState();
                players = players.map(p => ({ id: p.id, score: 0, lock: 0, active: true, winner: false }));
                localStorage.removeItem("players");
                render();
            }
        };

        document.getElementById("backBtn").onclick = () => {
            if (history.length > 0) {
                const last = history.pop();
                players = last.players;
                questionCount = last.questionCount;
                render();
            }
        };

        document.getElementById("resetQuestionCount").onclick = () => {
            if (confirm("問題数をリセットしますか？")) {
                questionCount = 1;
                updateQuestionCount();
            }
        };

        window.addEventListener("load", () => {
            const savedPlayers = localStorage.getItem("players");
            const savedQ = localStorage.getItem("questionCount");
            if (savedPlayers) players = JSON.parse(savedPlayers);
            if (savedQ) questionCount = parseInt(savedQ);
            render();
        });

        render();
    </script>

</body>

</html>
